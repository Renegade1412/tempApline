name: Build Python 3.11.7 (Alpine + glibc, manylinux compatible)

on:
  workflow_dispatch:

jobs:
  build-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python in Alpine with glibc
        uses: addnab/docker-run-action@v3
        with:
          # 基于 Alpine 3.24 + glibc 2.44，原生支持 manylinux wheel
          image: sirmark/alpine-glibc:3.24-glibc2.44
          options: -v ${{ github.workspace }}:/work
          run: |
            set -eux

            # 确认 glibc 环境就绪
            echo "=== Verify glibc is available ==="
            ldd --version | head -1

            # 安装编译依赖（Alpine 包名）
            apk add --no-cache \
              build-base \
              openssl-dev \
              bzip2-dev \
              xz-dev \
              readline-dev \
              sqlite-dev \
              libffi-dev \
              zlib-dev \
              tk-dev \
              linux-headers \
              curl \
              gdbm-dev \
              expat-dev \
              mpdecimal-dev \
              ncurses-dev \
              tcl-dev \
              binutils \
              patchelf

            cd /work
            curl -LO https://www.python.org/ftp/python/3.11.7/Python-3.11.7.tar.xz
            tar -xJf Python-3.11.7.tar.xz
            cd Python-3.11.7

            ./configure \
              --prefix=/opt/python-3.11.7 \
              --with-ensurepip=install \
              --enable-shared \
              --disable-test-modules

            make -j$(nproc)
            make install

            # ============================================
            # 升级 pip 到 26.3，固定 setuptools 83.0.0
            # ============================================
            echo "=== Upgrading pip to 26.3 and setuptools to 83.0.0 ==="
            export LD_LIBRARY_PATH=/opt/python-3.11.7/lib
            export SETUPTOOLS_USE_DISTUTILS=stdlib

            /opt/python-3.11.7/bin/python3.11 -m pip install --upgrade \
              'pip==26.3' \
              'setuptools==83.0.0'

            echo "=== Verify versions ==="
            /opt/python-3.11.7/bin/python3.11 -m pip --version
            /opt/python-3.11.7/bin/python3.11 -c \
              "import setuptools; print('setuptools', setuptools.__version__)"

            # ============================================
            # 确认 Python 链接的是 glibc，而非 musl
            # ============================================
            echo "=== Verify Python is linked against glibc ==="
            if ldd /opt/python-3.11.7/bin/python3.11 | grep -qi musl; then
              echo "ERROR: Python is unexpectedly linked against musl"
              exit 1
            fi
            ldd /opt/python-3.11.7/bin/python3.11 | grep -qi glibc && \
              echo "OK: Python is linked against glibc"

            # ============================================
            # 可选：快速验证 manylinux wheel 安装
            # 取消注释后可从 PyPI 拉取一个典型的 manylinux 轮子
            # ============================================
            # /opt/python-3.11.7/bin/python3.11 -m pip install --no-cache-dir \
            #   --only-binary=:all: --target /tmp/wheel-test \
            #   'cryptography==43.0.0'

            # ---- 产物依赖审计：确认没有 Brotli 等意外依赖 ----
            echo "=== Auditing shared objects under /opt/python-3.11.7 ==="
            if find /opt/python-3.11.7 -name '*.so*' -exec sh -c \
                 'readelf -d "$1" 2>/dev/null | grep -qi brotli && echo "$1"' _ {} \; \
                 | grep -q .; then
              echo "ERROR: Brotli dependency detected in build output"
              exit 1
            fi
            echo "OK: no Brotli dependency in build output"

            tar -czf /work/python-3.11.7-alpine-glibc.tar.gz -C /opt python-3.11.7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.11.7-alpine-glibc
          path: python-3.11.7-alpine-glibc.tar.gz
