name: Build Python 3.11.7 (manylinux glibc)

on:
  workflow_dispatch:

jobs:
  build-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Python Runtime
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/pypa/manylinux_2_28_x86_64
          options: -v ${{ github.workspace }}:/work

          run: |
            set -eux

            yum install -y \
              gcc \
              make \
              openssl-devel \
              bzip2-devel \
              xz-devel \
              readline-devel \
              sqlite-devel \
              libffi-devel \
              zlib-devel \
              tk-devel \
              gdbm-devel \
              expat-devel \
              mpdecimal-devel \
              ncurses-devel \
              tcl-devel \
              binutils \
              findutils \
              curl

            cd /work

            curl -LO \
              https://www.python.org/ftp/python/3.11.7/Python-3.11.7.tar.xz

            tar -xJf Python-3.11.7.tar.xz

            cd Python-3.11.7

            ./configure \
              --prefix=/opt/python-3.11.7 \
              --enable-shared \
              --with-ensurepip=install \
              --disable-test-modules

            make -j"$(nproc)"
            make install

            export LD_LIBRARY_PATH=/opt/python-3.11.7/lib

            echo "=== Upgrade pip ==="

            /opt/python-3.11.7/bin/python3.11 \
              -m pip install \
              --upgrade \
              pip==26.3

            echo "=== Verify pip ==="

            /opt/python-3.11.7/bin/python3.11 \
              -m pip --version

            echo "=== Collect Runtime Libraries ==="

            mkdir -p /opt/python-3.11.7/runtime-lib

            copy_lib () {
              find / -name "$1" 2>/dev/null | while read f
              do
                cp -av "$f" /opt/python-3.11.7/runtime-lib/ || true
              done
            }

            copy_lib "libffi.so*"
            copy_lib "libsqlite3.so*"
            copy_lib "libbz2.so*"
            copy_lib "liblzma.so*"
            copy_lib "libgdbm.so*"
            copy_lib "libreadline.so*"
            copy_lib "libncurses*.so*"
            copy_lib "libtinfo.so*"
            copy_lib "libpanel.so*"
            copy_lib "libexpat.so*"
            copy_lib "libz.so*"
            copy_lib "libuuid.so*"

            echo "=== Runtime Libraries ==="

            ls -alh /opt/python-3.11.7/runtime-lib || true

            echo "=== Check manylinux tags ==="

            /opt/python-3.11.7/bin/python3.11 \
              -m pip debug --verbose \
              | grep -A 20 "Compatible tags"

            echo "=== Brotli Audit ==="

            if find /opt/python-3.11.7 \
              -name '*.so*' \
              -exec sh -c \
              'readelf -d "$1" 2>/dev/null | grep -qi brotli && echo "$1"' _ {} \; \
              | grep -q .
            then
              echo "ERROR: Brotli dependency detected"
              exit 1
            fi

            echo "OK: No Brotli dependency"

            echo "=== Package Runtime ==="

            tar -czf \
              /work/python-3.11.7-manylinux.tar.gz \
              -C /opt \
              python-3.11.7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.11.7-manylinux
          path: python-3.11.7-manylinux.tar.gz
