name: Build sleep300.so (musllinux_1_2, x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate sleep300.py and setup.py
        run: |
          mkdir -p build-src

          printf '%s\n' \
            'import time' \
            'import logging' \
            '' \
            'def sleep300(inputs=None, parameters=None):' \
            '    print("Starting 300-second countdown...")' \
            '' \
            '    for second in range(1, 301):' \
            '        print(f"Elapsed time: {second} second(s)")' \
            '        time.sleep(1)' \
            '' \
            '    print("300 seconds completed.")' \
            '    print("sleep 300")' \
            '    return {"out": "sleep 300"}' \
            > build-src/sleep300.py

          printf '%s\n' \
            'from setuptools import setup' \
            'from Cython.Build import cythonize' \
            '' \
            'setup(' \
            '    ext_modules=cythonize(' \
            '        ["sleep300.py"],' \
            '        compiler_directives={"language_level": "3"},' \
            '    )' \
            ')' \
            > build-src/setup.py

          echo "=== sleep300.py ==="
          cat build-src/sleep300.py
          echo "=== setup.py ==="
          cat build-src/setup.py

      - name: Build .so in musllinux_1_2
        run: |
          docker run --rm -v "$PWD:/work" -w /work/build-src \
            quay.io/pypa/musllinux_1_2_x86_64 \
            bash -c '
              set -eux
              /opt/python/cp311-cp311/bin/pip install --upgrade pip
              /opt/python/cp311-cp311/bin/pip install cython setuptools wheel
              /opt/python/cp311-cp311/bin/python setup.py build_ext --inplace

              SO=$(ls *.so | head -1)
              echo "Artifact: $SO"

              # 验证产物后缀是否为 musl ABI
              if echo "$SO" | grep -q "x86_64-linux-musl"; then
                echo "OK: musl ABI detected in artifact name"
              else
                echo "ERROR: artifact does not carry -musl suffix: $SO"
                exit 1
              fi

              # 确认没有意外的 glibc 动态链接依赖
              if objdump -T "$SO" 2>/dev/null | grep -q "GLIBC_"; then
                echo "ERROR: GLIBC symbols detected in musl artifact"
                exit 1
              fi
              echo "OK: no GLIBC dependency found"
            '

      - name: List artifacts
        run: ls -lh build-src/*.so

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: sleep300-so-cp311-musllinux_1_2-x86_64
          path: "build-src/*.so"
          if-no-files-found: error
